<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#F8EBDD">

  <meta property="og:title" content="A Slice of Thanks">
  <meta property="og:description" content="Lift a slice to uncover a warm Thanksgiving wish.">
  <title>A Slice of Thanks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='37' r='24' fill='%23C76E2A' stroke='%235A2A1C' stroke-width='5'/%3E%3Cpath d='M8 35h48' stroke='%23F1C27B' stroke-width='7'/%3E%3Cpath d='M21 17 43 45M43 17 21 45' stroke='%23F8EBDD' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"}}</script>
  <style>
    :root{color-scheme:light;--cream:#F8EBDD;--paper:#FFF9F0;--ink:#382016;--rust:#9F4028;--pumpkin:#C76E2A;--gold:#E7B96B;--sage:#526B4D;--body:"Karla",Arial,sans-serif;--display:"DM Serif Display",Georgia,serif}
    *{box-sizing:border-box}[hidden]{display:none!important}
    html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#fff8ec 0%,var(--cream) 55%,#efdbc6 100%);color:var(--ink)}
    body{min-height:100svh;overflow-x:hidden;font-family:var(--body)}
    #leaves{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .page{position:relative;z-index:1;min-height:100svh;display:flex;justify-content:center;padding:34px 16px 38px}
    main{width:100%;max-width:520px;text-align:center}
    .eyebrow{margin:0 0 8px;color:var(--sage);font-size:.72rem;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
    h1{margin:0;color:var(--ink);font:400 clamp(2.25rem,9vw,3.3rem)/1.06 var(--display);text-wrap:balance}
    .subtitle{max-width:410px;margin:10px auto 0;color:#573322;font-size:.98rem;line-height:1.5}
    .recipient{color:var(--rust)}
    .pie-scene{position:relative;width:min(100%,390px);height:310px;margin:4px auto 0;perspective:950px;display:grid;place-items:center;touch-action:pan-y}
    #three-pie{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;pointer-events:none;touch-action:none;outline:none;z-index:2}
    #three-pie:focus-visible{outline:3px solid var(--rust);outline-offset:2px;border-radius:18px}
    .pie-scene.webgl-ready #three-pie{opacity:1;pointer-events:auto}
    .pie-scene.webgl-ready .pie-stage{display:none}
    .pie-stage{position:relative;width:290px;height:265px;transform-style:preserve-3d;transform:rotateX(0deg);}
    .turntable{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-25deg) rotateY(var(--tilt,0deg));transition:transform .35s ease}
    .turntable.spinning{animation:pie-spin .95s cubic-bezier(.18,.7,.2,1)}
    @keyframes pie-spin{from{transform:rotateX(58deg) rotateZ(-25deg) rotateY(0deg)}to{transform:rotateX(58deg) rotateZ(335deg) rotateY(0deg)}}
    .plate{position:absolute;left:5px;top:0;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle at 45% 38%,#fffdf8,#dfcfb8 72%,#ac9580);box-shadow:0 18px 0 #b49d87,0 23px 24px #44241435;transform:translateZ(-20px);}
    .plate::before{content:"";position:absolute;inset:13px;border:3px solid #c8b39b;border-radius:50%;box-shadow:inset 0 0 0 4px #f8f0e4}
    .crust{position:absolute;left:28px;top:23px;width:234px;height:234px;border-radius:50%;background:radial-gradient(circle at 37% 30%,#f5c987,#c87337 60%,#8f3e20 100%);box-shadow:0 13px 0 #86411f,0 16px 12px #4a24164d;transform:translateZ(2px)}
    .crust::before{content:"";position:absolute;inset:5px;border:8px dotted #f5d39d;border-radius:50%;filter:drop-shadow(0 1px 1px #7f3f20)}
    .filling{position:absolute;left:47px;top:42px;width:196px;height:196px;border-radius:50%;border:3px solid #9b4d27;background:radial-gradient(circle at 42% 34%,#e69643,#bc5e23 73%,#8e3c1d);transform:translateZ(17px);overflow:hidden}
    .filling::before{content:"";position:absolute;inset:9px;border-radius:50%;background:repeating-linear-gradient(45deg,transparent 0 24px,#f2c8879c 25px 30px),repeating-linear-gradient(-45deg,transparent 0 24px,#f2c8879c 25px 30px);opacity:.9}
    .slice{position:absolute;inset:0;border-radius:50%;z-index:2;clip-path:polygon(50% 50%,50% 0,100% 0,100% 50%);background:linear-gradient(145deg,#efb765,#c86d31 67%,#93451f);border:0;transform:translateZ(24px);transform-origin:53% 49%;transition:transform .85s cubic-bezier(.18,.72,.24,1),opacity .6s ease}
    .slice::before{content:"";position:absolute;inset:8px;background:repeating-linear-gradient(45deg,transparent 0 25px,#ffe0a8 26px 31px),repeating-linear-gradient(-45deg,transparent 0 25px,#ffe0a8 26px 31px);opacity:.8}
    .slice.taken{transform:translate3d(62px,-55px,85px) rotateZ(12deg);opacity:0}
    .pie-shadow{position:absolute;left:34px;top:228px;width:220px;height:40px;border-radius:50%;background:#5b311f25;filter:blur(9px);transform:translateZ(-32px)}
    .controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:0 auto 10px}
    button{min-height:48px;padding:11px 17px;border:2px solid var(--ink);border-radius:999px;font:700 .9rem var(--body);cursor:pointer;touch-action:manipulation;transition:transform .15s ease,background .15s ease,box-shadow .15s ease}
    button:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
    button:active{transform:translateY(2px)}
    .primary{background:var(--rust);color:#fff9f0;box-shadow:0 4px 0 #602719}
    .primary:hover:not(:disabled){background:#85351f}
    .secondary,.sound{background:#fff9f0;color:var(--ink);box-shadow:0 4px 0 #c5ad94}
    .secondary:hover:not(:disabled),.sound:hover{background:#fff}
    button:disabled{opacity:.58;cursor:default}
    .sound-row{margin:2px 0 14px}
    .found-count{display:inline-block;margin:4px auto 14px;padding:7px 12px;border:1px solid #c6ac91;border-radius:999px;background:#fff9f0;color:#4e3929;font-size:.78rem;font-weight:800}
    .table-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:460px;margin:0 auto 16px}
    .harvest-item{min-height:94px;padding:10px 6px 8px;border:1px solid #c6ac91;border-radius:16px;background:#fff9f0;color:var(--ink);box-shadow:0 5px 0 #c5ad94;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;perspective:400px}
    .harvest-item:hover{background:#fffdf9;transform:translateY(-3px) rotateX(5deg)}
    .harvest-item svg{width:40px;height:40px;transition:transform .25s ease;transform-style:preserve-3d}
    .harvest-item:active svg,.harvest-item.bop svg{animation:object-bop .48s ease}
    .harvest-item span{font-size:.77rem;font-weight:800;line-height:1.1}
    @keyframes object-bop{35%{transform:rotateY(24deg) rotateZ(-8deg) scale(1.14)}70%{transform:rotateY(-10deg) rotateZ(5deg) scale(.98)}}
    .note-dialog{width:min(calc(100% - 32px),420px);max-width:420px;padding:25px 23px 21px;border:2px solid #bd8c65;border-radius:20px;background:#fff9f0;color:var(--ink);box-shadow:0 20px 70px #27170f55;text-align:center}
    .note-dialog::backdrop{background:#241610a8;backdrop-filter:blur(3px)}
    .note-dialog[open]{animation:note-pop .28s cubic-bezier(.2,1.4,.4,1)}
    @keyframes note-pop{from{opacity:0;transform:translateY(14px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}
    .note-dialog h2{margin:0 0 10px;color:var(--rust);font:400 1.75rem/1.1 var(--display)}
    .note-dialog p{margin:0;color:#42271b;font-size:1.05rem;font-weight:600;line-height:1.55}
    .note-dialog .note-from{margin-top:12px;color:var(--sage);font:italic 400 1.15rem var(--display)}
    .close-note{min-height:48px;margin-top:19px;padding:10px 20px;border:0;border-radius:999px;background:var(--rust);color:#fff9f0;font:700 .9rem var(--body);cursor:pointer}
    .hint{margin:12px 0 0;color:#614534;font-size:.78rem}
    @media(max-width:360px){.pie-scene{height:278px}.pie-stage{transform:scale(.88)}.controls{gap:8px}.controls button{padding-left:13px;padding-right:13px}.table-items{gap:8px}.harvest-item{min-height:88px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}.slice.taken{transform:translate3d(62px,-55px,85px) rotateZ(12deg);opacity:0}}
  </style>
</head>
<body>
  <canvas id="leaves" aria-hidden="true"></canvas>
  <div class="page"><main>
    <p class="eyebrow">A Thanksgiving wish</p>
    <h1>A little slice of thanks for <span id="to-name" class="recipient">friend</span></h1>
    <p class="subtitle">A cozy little Thanksgiving table is waiting. Tap the pie, turkey, pumpkin, corn, candle, or leaves to find six notes.</p>
    <div id="pie-scene" class="pie-scene" aria-label="Interactive Thanksgiving table">

      </button>
      <button class="harvest-item" type="button" data-note="2" aria-label="Tap the pumpkin for a Thanksgiving note">
        <svg viewBox="0 0 80 80" aria-hidden="true"><path d="M40 19c-3-9 1-13 8-15" fill="none" stroke="#526B4D" stroke-width="5" stroke-linecap="round"/><path d="M40 20C23 13 10 27 12 44c1 17 12 25 28 22 16 3 27-5 28-22 2-17-11-31-28-24Z" fill="#D98235" stroke="#8B431F" stroke-width="2.5"/><path d="M40 20c-10 8-11 34 0 46m0-46c10 8 11 34 0 46M25 20c-8 12-8 31 0 42m30-42c8 12 8 31 0 42" fill="none" stroke="#F4B660" stroke-width="3"/></svg><span>Pumpkin</span>

      </button>
      <button class="harvest-item" type="button" data-note="4" aria-label="Tap the candle for a Thanksgiving note">
        <svg viewBox="0 0 80 80" aria-hidden="true"><path d="M40 8c-12 12 1 15-4 23 10-3 13-11 9-18 8 8 13 18 4 25H31c-11-8-4-20 9-30Z" fill="#E7A83F" stroke="#9F5425" stroke-width="2.5"/><path d="M29 33h22v36H29z" fill="#F6E4C6" stroke="#85533A" stroke-width="2.5"/><path d="M29 42h22m-22 9h22m-22 9h22" stroke="#D3B494" stroke-width="2"/><path d="M40 25v8" stroke="#42271B" stroke-width="2.5"/></svg><span>Candle</span>
      </button>
      <button class="harvest-item" type="button" data-note="5" aria-label="Tap the autumn leaves for a Thanksgiving note">
        <svg viewBox="0 0 80 80" aria-hidden="true"><path d="M39 68C21 50 11 35 18 16c17 1 30 10 27 27-2 11-6 19-6 25Z" fill="#BD6335" stroke="#75361F" stroke-width="2.5"/><path d="M40 67c12-20 24-32 20-51-17 0-29 11-25 27 2 10 5 17 5 24Z" fill="#D89B43" stroke="#8B5226" stroke-width="2.5"/><path d="M39 68 25 26m14 42 24-40M33 50l-10-2m19 9 13-5" fill="none" stroke="#F3D19A" stroke-width="2.5" stroke-linecap="round"/></svg><span>Autumn leaves</span>
      </button>
    </div>
    <div class="sound-row"><button id="sound-button" class="sound" type="button" aria-pressed="true">Sound on</button></div>
    <dialog id="note-dialog" class="note-dialog" aria-labelledby="note-title">
      <h2 id="note-title" aria-live="polite" aria-atomic="true"></h2>
      <p id="note-message" aria-live="polite" aria-atomic="true"></p>
      <p id="note-from" class="note-from"></p>

    </dialog>
    <p class="hint">Move your pointer over the pie to tilt it. Tap each keepsake to uncover all six notes.</p>
  </main></div>
  <script>
    (()=>{
      'use strict';
      const STORAGE_KEY='thanksgiving-pie.personalization.v1';
      const DEFAULT_MESSAGE='I’m thankful for your laughter, your kindness, and all the ordinary moments that feel like home with you.';
      const clean=(value,max)=>String(value??'').replace(/[\u0000-\u001f\u007f-\u009f]/g,'').trim().slice(0,max).trim();
      let saved={to:'',from:'',message:''};
      try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const p=JSON.parse(raw);saved={to:clean(p.to,24),from:clean(p.from,24),message:clean(p.message,180)}}}catch(_error){}
      const params=new URLSearchParams(location.search);
      const toParam=params.has('to')?clean(params.get('to'),24):'';
      const fromParam=params.has('from')?clean(params.get('from'),24):'';
      const messageParam=params.has('msg')?clean(params.get('msg'),180):'';
      const recipient=toParam||saved.to||'friend',sender=fromParam||saved.from||'',message=messageParam||saved.message||DEFAULT_MESSAGE;
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify({to:recipient,from:sender,message}))}catch(_error){}
      document.getElementById('to-name').textContent=recipient;
      document.getElementById('from-name').textContent=sender||'you';
      const reduced=matchMedia('(prefers-reduced-motion: reduce)'),turntable=document.getElementById('turntable'),pieScene=document.getElementById('pie-scene'),slice=document.getElementById('slice'),revealButton=document.getElementById('reveal-button'),spinButton=document.getElementById('spin-button'),soundButton=document.getElementById('sound-button'),noteDialog=document.getElementById('note-dialog'),noteTitle=document.getElementById('note-title'),noteMessage=document.getElementById('note-message'),noteFrom=document.getElementById('note-from'),closeNote=document.getElementById('close-note'),foundCount=document.getElementById('found-count');
      const notes=[
        {title:'A slice of thanks',message:recipient+', '+message},
        {title:'Turkey’s tiny toast',message:'May the laughter be loud, the sides be plentiful, and the couch be close by when the feast is done.'},
        {title:'Pumpkin wishes',message:'Wishing you cozy blankets, golden leaves, and exactly the right amount of pie.'},
        {title:'A kernel of truth',message:'The best thing on this table is the people gathered around it—and you’re one of my favorites.'},
        {title:'A little glow',message:'May the warmth you bring other people find its way back to you tonight.'},
        {title:'Leaf it to gratitude',message:'May the small, ordinary moments with you become the memories we treasure most.'}
      ];
      const found=new Set();let opener=null;
      let revealed=false,soundOn=true,audio=null,spinTimer=0;
      function chime(){if(!soundOn)return;try{const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;if(!audio)audio=new AudioContextClass();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;[523.25,659.25,783.99].forEach((frequency,index)=>{const oscillator=audio.createOscillator(),gain=audio.createGain(),start=now+index*.16;oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.055,start+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+.42);oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(start);oscillator.stop(start+.44)})}catch(_error){}}
      function gobble(){if(!soundOn)return;try{const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;if(!audio)audio=new AudioContextClass();if(audio.state==='suspended')audio.resume();const now=audio.currentTime,osc=audio.createOscillator(),filter=audio.createBiquadFilter(),gain=audio.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(205,now);osc.frequency.exponentialRampToValueAtTime(125,now+.12);osc.frequency.setValueAtTime(158,now+.16);osc.frequency.exponentialRampToValueAtTime(82,now+.38);filter.type='lowpass';filter.frequency.value=520;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.045,now+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+.4);osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.42)}catch(_error){}}
      function openNote(index,trigger){const note=notes[index];if(!note)return;found.add(index);foundCount.textContent=found.size===6?'6 of 6 notes found — Happy Thanksgiving!':found.size+' of 6 little notes found';noteTitle.textContent=note.title;noteMessage.textContent=note.message;noteFrom.textContent=sender?'With love, '+sender:'With love, you';opener=trigger?.disabled?spinButton:trigger;if(!noteDialog.open)noteDialog.showModal();closeNote.focus();if(index===1)gobble();else chime()}
      function reveal(){if(revealed)return;revealed=true;slice.classList.add('taken');revealButton.textContent='Slice enjoyed';revealButton.disabled=true;window.dispatchEvent(new Event('pie-slice-lifted'));openNote(0,revealButton);if(!reduced.matches)leafFlurry()}
      revealButton.addEventListener('click',reveal);
      spinButton.addEventListener('click',()=>{if(reduced.matches)return;turntable.classList.remove('spinning');void turntable.offsetWidth;turntable.classList.add('spinning');clearTimeout(spinTimer);spinTimer=setTimeout(()=>turntable.classList.remove('spinning'),1000);window.dispatchEvent(new Event('pie-spin-request'))});
      document.querySelectorAll('.harvest-item').forEach(button=>button.addEventListener('click',()=>{button.classList.remove('bop');void button.offsetWidth;button.classList.add('bop');setTimeout(()=>button.classList.remove('bop'),550);openNote(Number(button.dataset.note),button)}));
      closeNote.addEventListener('click',()=>noteDialog.close());
      noteDialog.addEventListener('close',()=>{if(opener&&opener.isConnected)opener.focus()});
      window.addEventListener('harvest-note',event=>openNote(Number(event.detail),document.getElementById('three-pie')));
      soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.textContent=soundOn?'Sound on':'Sound off';soundButton.setAttribute('aria-pressed',String(soundOn))});
      pieScene.addEventListener('pointermove',event=>{if(reduced.matches||event.pointerType==='touch')return;const rect=pieScene.getBoundingClientRect(),tilt=((event.clientX-rect.left)/rect.width-.5)*12;turntable.style.setProperty('--tilt',tilt.toFixed(1)+'deg')},{passive:true});
      pieScene.addEventListener('pointerleave',()=>turntable.style.setProperty('--tilt','0deg'),{passive:true});
      spinButton.disabled=reduced.matches;
      reduced.addEventListener?.('change',event=>{spinButton.disabled=event.matches;if(event.matches){turntable.classList.remove('spinning');clearTimeout(spinTimer);stopLeaves()}});

      const canvas=document.getElementById('leaves'),ctx=canvas.getContext('2d');let width=0,height=0,dpr=1,leaves=[],raf=0,lastTime=0;
      const random=(min,max)=>Math.random()*(max-min)+min;
      function resize(){dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=innerHeight;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!reduced.matches&&!raf){leaves=Array.from({length:18},()=>makeLeaf(random(0,width),random(-height,height)));raf=requestAnimationFrame(animate)}}
      function makeLeaf(x,y){return{x,y,vx:random(-.35,.35),vy:random(.45,1.25),size:random(7,14),angle:random(0,6.28),spin:random(-.018,.018),color:['#A8442D','#CB762F','#D7A047','#78814F'][Math.floor(random(0,4))],life:0,born:0}}
      function leafFlurry(){if(reduced.matches)return;const now=performance.now();for(let i=0;i<32;i++){const leaf=makeLeaf(random(0,width),random(-height*.5,0));leaf.born=now;leaf.life=4800;leaves.push(leaf)}if(!raf)raf=requestAnimationFrame(animate)}
      function drawLeaf(leaf){ctx.save();ctx.translate(leaf.x,leaf.y);ctx.rotate(leaf.angle);ctx.fillStyle=leaf.color;ctx.beginPath();ctx.moveTo(0,-leaf.size);ctx.quadraticCurveTo(leaf.size*.9,-leaf.size*.55,leaf.size*.5,leaf.size*.3);ctx.quadraticCurveTo(0,leaf.size, -leaf.size*.55,leaf.size*.25);ctx.quadraticCurveTo(-leaf.size*.95,-leaf.size*.55,0,-leaf.size);ctx.fill();ctx.strokeStyle='#553725aa';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,-leaf.size*.75);ctx.lineTo(0,leaf.size*.65);ctx.stroke();ctx.restore()}

      function resize(){const rect=host.getBoundingClientRect();if(rect.width<1||rect.height<1)return;renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix();if(reduced.matches)renderer.render(scene,camera);else if(!raf)raf=requestAnimationFrame(render)}
